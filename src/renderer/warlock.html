<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Warlock</title>
  <link rel="stylesheet" href="warlock.css">
  <link rel="stylesheet" href="game-fx.css">
</head>
<body>
  <canvas id="view"></canvas>
  <div class="labels" id="labels"></div>

  <!-- Lobby: who has joined; the host chooses the rounds and starts. -->
  <section class="lobby" id="lobby">
    <div class="lobby-card">
      <div class="logo">WARLOCK</div>
      <div class="lobby-sub" id="lobbySub"></div>
      <ul class="lobby-list" id="lobbyList"></ul>
      <div class="lobby-opts hidden" id="lobbyOpts">
        <div class="opt-row"><span data-t="Mode"></span><div class="seg" id="modeSeg"></div></div>
        <div class="opt-row"><span data-t="Teams"></span><div class="seg" id="teamSeg"></div></div>
        <div class="opt-row"><span data-t="Win"></span><div class="seg" id="winSeg"></div><div class="seg" id="roundsSeg"></div></div>
      </div>
      <div class="lobby-rules" id="lobbyRules"></div>
      <button class="big-btn hidden" id="btnStart"></button>
      <div class="lobby-help" id="lobbyHelp"></div>
    </div>
  </section>

  <!-- In-game HUD -->
  <div class="hud hidden" id="hud">
    <div class="top-bar"><span id="roundInfo"></span><span id="phaseInfo"></span><button class="shop-btn hidden" id="btnShop"></button></div>
    <div class="scores" id="scores"></div>
    <div class="feed" id="feed"></div>
    <div class="banner hidden" id="banner"></div>
    <!-- Dota-style panel: the selected hero's portrait, health, spells and items. -->
    <div class="card" id="card">
      <div class="portrait" id="portrait"><img id="pImg" alt=""><span class="ptag" id="pTag"></span></div>
      <div class="unit">
        <div class="uname" id="uName"></div>
        <div class="hp"><i id="hpFill"></i><span id="hpText"></span></div>
        <div class="ustats" id="uStats"></div>
      </div>
      <div class="spells" id="spellBar"></div>
      <div class="items" id="itemGrid"></div>
    </div>
  </div>

  <!-- Shop between rounds -->
  <section class="shop hidden" id="shop">
    <div class="shop-card">
      <div class="shop-head"><b data-t="Shop"></b><span class="gold" id="gold"></span><span class="shop-time" id="shopTime"></span><button class="big-btn small" id="btnReady"></button></div>
      <div class="shop-cols" id="shopCols"></div>
      <div class="shop-items" id="shopItems"></div>
      <div class="shop-mastery" id="shopMastery"></div>
      <div class="shop-tip" id="shopTip"></div>
    </div>
  </section>

  <!-- Esc menu -->
  <section class="menu hidden" id="menu">
    <div class="menu-card">
      <div class="menu-title" data-t="Menu"></div>
      <div class="menu-opts" id="menuOpts"></div>
      <div class="menu-btns">
        <button class="big-btn small" id="btnResume" data-t="Resume"></button>
        <button class="big-btn small leave" id="btnLeave" data-t="Leave game"></button>
      </div>
      <div class="menu-confirm hidden" id="menuConfirm">
        <span data-t="Leave the match? You cannot come back in."></span>
        <button class="big-btn small leave" id="btnLeaveYes" data-t="Leave"></button>
        <button class="big-btn small" id="btnLeaveNo" data-t="Stay"></button>
      </div>
      <div class="menu-help" data-t="Esc opens and closes this menu."></div>
    </div>
  </section>

  <!-- Drawn cursor while the mouse is kept inside the window -->
  <div class="cursor hidden" id="cursor"></div>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/warlock.js"></script>
  <script src="game-fx.js"></script>
  <script type="module" src="warlock.js"></script>
</body>
</html>
