name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check update signing key
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if ($env:UPDATE_SIGNING_KEY) {
            Write-Output "Signing key found ($($env:UPDATE_SIGNING_KEY.Length) characters)"
          } else {
            Write-Output "::warning::The UPDATE_SIGNING_KEY secret is not available to this build. Add it under Settings > Secrets and variables > Actions > Repository secrets."
          }

      - name: Build installer and portable app
        run: npm run dist
        env:
          # Signs the build so PCs can pass it to each other as an update.
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

      - name: Upload for download
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
