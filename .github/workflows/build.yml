name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check update signing key
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if ($env:UPDATE_SIGNING_KEY) {
            Write-Output "Signing key found ($($env:UPDATE_SIGNING_KEY.Length) characters)"
          } else {
            Write-Output "::warning::The UPDATE_SIGNING_KEY secret is not available to this build. Add it under Settings > Secrets and variables > Actions > Repository secrets."
          }

      - name: Build installer and portable app
        run: npm run dist
        env:
          # Signs the build so PCs can pass it to each other as an update.
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

      - name: Upload for download
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $tag = $env:GITHUB_REF_NAME } else { $tag = "v$v" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LAN Messenger 2 ${{ steps.ver.outputs.tag }}
          body_path: build/release-notes.md
          files: dist/*.exe
